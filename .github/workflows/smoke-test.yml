name: Smoke test

# Prueba de humo del motor sin interfaz gráfica (ver tools/smoke_test.py):
# genera un .ass de karaoke, lo procesa con el motor de nodos y comprueba la
# generación de líneas de efecto, el marcador pyxis_fx y el determinismo
# entre ejecución secuencial y multiproceso.

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install -r PyxisNodes/requirements.txt

      - name: Prueba de humo
        run: python tools/smoke_test.py
